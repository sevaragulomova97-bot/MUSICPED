name: GitHub Pages'ga joylash

# Loyiha sof statik sayt — build natijasi (`out/`) to'g'ridan-to'g'ri Pages'ga
# yuklanadi. Hech qanday server, baza yoki pullik xizmat ishlatilmaydi.

on:
  push:
    branches:
      - main
      - claude/musicped-account-storage-dcg5ox
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Bir vaqtda faqat bitta joylash ketsin; yangisi eskisini kutadi.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Qurish
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pages sozlamalarini aniqlash
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Pages hali yoqilmagan bo'lsa, action uni o'zi yoqadi va manbani
          # "GitHub Actions" ga qo'yadi. Shuning uchun omborda qo'lda hech narsa
          # sozlash shart emas — bu boshqa omborga ko'chirilganda ham ishlaydi.
          enablement: true

      - name: Bog'liqliklarni o'rnatish
        # Playwright faqat e2e testlar uchun kerak; Pages build'ida brauzer
        # yuklab olish shart emas va u ~150 MB trafik va bir necha daqiqa vaqt oladi.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci

      - name: Tiplarni tekshirish
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testlar
        run: npm test --if-present

      - name: Build
        # `base_path` omborning manzilidan avtomatik olinadi, masalan `/MusicPed`.
        # Shu sababli ombor nomi o'zgarsa ham hech narsani qo'lda tuzatish shart emas.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Natijani artefakt sifatida yuklash
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  e2e:
    name: Uchdan-uchiga testlar
    runs-on: ubuntu-latest
    # DIQQAT: bu ish joylashni **to'xtatmaydi** (`deploy` faqat `build` ga
    # bog'liq). Sabab: e2e testlar brauzer ustida ishlaydi va vaqti-vaqti
    # bilan muhit sababli yiqilishi mumkin. Platformani bitta odam yuritadi,
    # shuning uchun tasodifiy yiqilish saytni yangilashni bloklamasligi
    # kerak — natija ko'rinadi, lekin joylash to'xtamaydi.
    continue-on-error: true
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci

      - name: Build (basePath'siz)
        # e2e testlar saytni `/` ildizidan xizmat qiladi, Pages esa
        # `/<ombor>/` ostidan. Shuning uchun bu yerda alohida, prefikssiz
        # build qilinadi — Pages artefaktini qayta ishlatib bo'lmaydi.
        run: npm run build

      - name: Chromium o'rnatish
        run: npx playwright install --with-deps chromium

      - name: e2e testlar
        run: npm run test:e2e

      # Pages saytni `/<ombor>/` ostidan beradi, yuqoridagi testlar esa
      # ildizdan xizmat qilinadigan build ustida ishlaydi. Yo'l prefiksi
      # bilan bog'liq xato (havolalar, audio, xizmat ishchisi, manifest)
      # shuning uchun alohida tekshiriladi.
      - name: basePath bilan qurilgan sayt
        run: npm run test:e2e:basepath

      - name: Hisobotni saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hisobot
          path: playwright-report
          retention-days: 7

  deploy:
    name: Joylash
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'ga joylash
        id: deployment
        uses: actions/deploy-pages@v4
